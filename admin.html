 if(r.data&&r.data.issue)r.status='approved';
 EDIT={r:JSON.parse(JSON.stringify(r)),h,msg:''};drawEdit()}
function drawEdit(){let m=$('mdl');if(!m){m=document.createElement('div');m.id='mdl';m.className='mdl';document.body.appendChild(m)}
 if(!EDIT){m.remove();return}const r=EDIT.r,d=r.data,o=d.o&&d.o.length?d.o:['','','',''],bn=d.s==='বাংলা',mc=(d.o&&d.o.length)||false;

 <div class="f3"><select id="eS">${SUBJ.map(s=>`<option value="${s}" ${s===d.s?'selected':''}>${dsp(s)}</option>`).join('')}</select>${bn?`<select id="eG"><option value="">${tr('গদ্য/পদ্য','Group')}</option><option ${d.g==='গদ্য'?'selected':''}>গদ্য</option><option ${d.g==='পদ্য'?'selected':''}>পদ্য</option></select>`:''}<select id="eSt"><option value="approved" ${r.status==='approved'?'selected':''}>✅ ${tr('প্রকাশিত','Published')}</option><option value="pending" ${r.status==='pending'?'selected':''}>⏳ ${tr('অপেক্ষায়','Pending')}</option></select></div>

 <div class="f3"><input id="eC" list="dle" value="${esc(d.c||'')}" placeholder="${tr('অধ্যায়/রচনা/টপিক','Chapter / piece / topic')}"><input id="eL" value="${esc(d.sec||'')}" placeholder="${tr('পাঠ','Lesson')}"></div>
 <textarea id="eQ" rows="3" placeholder="${tr('প্রশ্ন','Question')}">${esc(d.q||'')}</textarea>

 <p class="mut" style="margin:2px 0">${tr('অপশন ফাঁকা রাখলে এটি সংক্ষিপ্ত প্রশ্ন হবে (নিচে উত্তর লিখুন)।','Leave options empty for a short-answer question (write the answer below).')}</p>
 <input id="eT" value="${esc(d.t||'')}" placeholder="${tr('সংক্ষিপ্ত উত্তর','Short answer')}"><textarea id="eE" rows="2" placeholder="${tr('ব্যাখ্যা','Explanation')}">${esc(d.e||'')}</textarea><textarea id="eH" rows="2" placeholder="${tr('ইঙ্গিত (উত্তর বলে দেবেন না)','Hint (do not reveal the answer)')}">${esc(d.h||'')}</textarea>
 <p class="mut" id="eM" style="color:#e11d48">${esc(EDIT.msg)}</p>
 <div class="tools"><button class="ok" data-edsv>💾 ${tr('সংরক্ষণ','Save')}</button><button class="o" data-edx>${tr('বন্ধ','Close')}</button>${r.id==='new'?'':`<button class="dg" data-eddl>🗑 ${tr('মুছুন','Delete')}</button>`}</div>
 ${EDIT.h.length?`<h3 style="margin-top:14px">🕘 ${tr('পরিবর্তনের ইতিহাস','History')}</h3>${EDIT.h.map(x=>`<div class="row" style="padding:8px"><div class="tx"><b>${esc(x.action)}</b> · <span class="mut">${new Date(x.changed_at).toLocaleString(lang==='bn'?'bn-BD':'en-GB')}</span>${x.before?`<div class="meta">${esc(((x.before.data||{}).q||'').slice(0,80))} · ${esc((x.before.data||{}).c||'')}</div>`:''}</div>${x.before&&x.action!=='create'?`<div class="acts"><button class="o" data-edrs="${x.id}">↩ ${tr('ফিরিয়ে আনুন','Restore')}</button></div>`:''}</div>`).join('')}`:''}</div>`}
async function edSave(){const r=EDIT.r,old=JSON.parse(JSON.stringify(r)),g=id=>$(id),d={...r.data};
 d.s=g('eS').value;d.c=g('eC').value.trim();d.sec=g('eL').value.trim();d.q=g('eQ').value.trim();const gE=g('eG');if(gE)d.g=gE.value;else delete d.g;if(!d.g)delete d.g;
 const o=[...document.querySelectorAll('.eo')].map(x=>x.value.trim()),anyO=o.some(Boolean);
 if(anyO){const a=document.querySelector('input[name=ea]:checked');d.o=o;d.a=a?+a.value:null;delete d.t}else{d.o=[];delete d.a;d.t=g('eT').value.trim()}
 const e=g('eE').value.trim(),h=g('eH').value.trim();if(e)d.e=e;else delete d.e;if(h)d.h=h;else delete d.h;
 const st=g('eSt').value;let msg='';if(!d.q)msg=tr('প্রশ্ন লিখুন।','Write the question.');else if(incomplete(d))msg=anyO?tr('চারটি অপশন ও সঠিক উত্তর বাছুন।','Fill all four options and pick the correct one.'):tr('সংক্ষিপ্ত উত্তর লিখুন।','Write the short answer.');
 else if(st==='approved'&&!d.c)msg=tr('প্রকাশ করতে অধ্যায় দিন, নয়তো “অপেক্ষায়” রাখুন।','Add a chapter to publish, or keep it Pending.');
 if(msg){EDIT.msg=msg;drawEdit();return}
 d.cls='manual';d.conf=1;delete d.issue;const nk=kOf(d);
 if(ALL.some(x=>x.key===nk&&String(x.id)!==String(r.id))){EDIT.msg=tr('এই বিষয়/অধ্যায়ে একই প্রশ্ন আগে থেকে আছে (ডুপ্লিকেট)।','The same question already exists here (duplicate).');drawEdit();return}
 try{if(r.id==='new'){const got=await api('/rest/v1/public_questions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({key:nk,owner:S.uid,status:st,data:d})},true);if(got&&got[0])hist(got[0].id,'create',null,got[0])}
  else{await hist(r.id,'edit',{key:old.key,status:old.status,data:old.data},{key:nk,status:st,data:d});await api('/rest/v1/public_questions?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({key:nk,status:st,data:d})},true)}
  EDIT=null;drawEdit();await loadAll();toast('✓ '+tr('সংরক্ষিত','Saved'));render()}catch(x){EDIT.msg='⚠ '+bad(x);drawEdit()}}
async function edDel(){const r=EDIT.r;if(!confirm(tr('প্রশ্নটি মুছে ফেলবেন? (ইতিহাসে থেকে যাবে)','Delete this question? (kept in history)')))return;
 try{await hist(r.id,'delete',{key:r.key,status:r.status,data:r.data},null);await api('/rest/v1/public_questions?id=eq.'+r.id,{method:'DELETE',headers:{Prefer:'return=minimal'}},true);EDIT=null;drawEdit();await loadAll();toast('✓ '+tr('মোছা হয়েছে','Deleted'));render()}catch(x){EDIT.msg='⚠ '+bad(x);drawEdit()}}
async function edRestore(hid){const h=EDIT.h.find(x=>String(x.id)===String(hid));if(!h||!h.before)return;const r=EDIT.r;
 try{await hist(r.id,'restore',{key:r.key,status:r.status,data:r.data},h.before);await api('/rest/v1/public_questions?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({key:h.before.key,status:h.before.status,data:h.before.data})},true);EDIT=null;drawEdit();await loadAll();toast('✓ '+tr('আগের অবস্থায় ফেরানো হয়েছে','Restored'));render()}catch(x){EDIT.msg='⚠ '+bad(x);drawEdit()}}
/* ---------- একসাথে সরানো / মোছা ---------- */
async function bulkMove(){const c=$('mvC').value.trim(),l=$('mvL').value.trim(),g=($('mvG')||{}).value||'';if(!c){toast('⚠ '+tr('অধ্যায় লিখুন','Enter a chapter'));return}
 if(busy)return;busy=true;let ok=0,fail=0;try{for(const id of [...SEL]){const r=ALL.find(x=>x.id===id);if(!r)continue;const d={...r.data,c,sec:l,cls:'manual',conf:1};if(g)d.g=g;else if(d.s!=='বাংলা')delete d.g;delete d.issue;const nk=kOf(d);
   if(ALL.some(x=>x.key===nk&&x.id!==id)){fail++;continue}
   await hist(id,'move',{key:r.key,status:r.status,data:r.data},{key:nk,status:r.status,data:d});try{await api('/rest/v1/public_questions?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({key:nk,data:d})},true);ok++}catch{fail++}}
  SEL.clear();await loadAll();toast(`✓ ${fm(ok)} ${tr('টি সরানো হয়েছে','moved')}${fail?` · ${fm(fail)} ${tr('টি বাদ (ডুপ্লিকেট/ত্রুটি)','skipped')}`:''}`)}catch(e){toast('⚠ '+bad(e))}finally{busy=false;render()}}
async function bulkDelete(){if(!SEL.size||!confirm(tr(fm(SEL.size)+'টি প্রশ্ন মুছবেন?','Delete '+SEL.size+' questions?')))return;if(busy)return;busy=true;try{for(const id of [...SEL]){const r=ALL.find(x=>x.id===id);if(r)await hist(id,'delete',{key:r.key,status:r.status,data:r.data},null);await api('/rest/v1/public_questions?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}},true)}SEL.clear();await loadAll();toast('✓ '+tr('মোছা হয়েছে','Deleted'))}catch(e){toast('⚠ '+bad(e))}finally{busy=false;render()}}

  mis=ALL.filter(r=>r.status==='approved').map(r=>{const d=r.data||{},rl=ruleClassify(d.s,d);return rl&&rl.confidence>=.75&&(rl.chapter!==d.c||(rl.grp&&d.g&&rl.grp!==d.g))?{r,rl}:null}).filter(Boolean),noexp=ALL.filter(r=>r.status==='approved'&&!(r.data||{}).e).length;

 if(d.eddl!==undefined)return edDel();
 if(d.edrs!==undefined)return edRestore(d.edrs);
 if(d.mv!==undefined)return bulkMove();if(d.mvd!==undefined)return bulkDelete();if(d.mvc!==undefined){SEL.clear();return render()}
 if(d.txa!==undefined){const c=$('txC').value.trim();if(!c){toast('⚠ '+tr('নাম লিখুন','Enter a name'));return}return txAdd([{subject:TXS,grp:TXS==='বাংলা'?($('txG')||{}).value||'গদ্য':'',chapter:c,lesson:$('txL').value.trim(),keywords:$('txK').value.trim(),sort:TAX.length+1}])}
 if(d.txb!==undefined){const g=TXS==='বাংলা'?($('txG')||{}).value||'গদ্য':'',rows=$('txB').value.split('\n').map(x=>x.trim()).filter(Boolean).map((x,i)=>{const[a,b]=x.split('|');return{subject:TXS,grp:g,chapter:a.trim(),lesson:'',keywords:(b||'').trim(),sort:TAX.length+i+1}});return txAdd(rows)}
 if(d.txe!==undefined){const r=TAX.find(x=>String(x.id)===d.txe);if(!r)return;const c=prompt(tr('অধ্যায়/রচনার নাম','Chapter name'),r.chapter);if(c===null)return;const l=prompt(tr('পাঠ (ফাঁকা হতে পারে)','Lesson (may be empty)'),r.lesson);if(l===null)return;const k=prompt(tr('কীওয়ার্ড (কমা দিয়ে)','Keywords (comma separated)'),r.keywords);if(k===null)return;
  try{await api('/rest/v1/taxonomy?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({chapter:c.trim()||r.chapter,lesson:l.trim(),keywords:k.trim()})},true);await loadTax();toast('✓ '+tr('সংরক্ষিত','Saved'));render()}catch(x){toast('⚠ '+bad(x))}return}
 if(d.txd!==undefined){if(!confirm(tr('কাঠামো থেকে সরাবেন? (প্রশ্নগুলো থাকবে)','Remove from structure? (questions stay)')))return;try{await api('/rest/v1/taxonomy?id=eq.'+d.txd,{method:'DELETE',headers:{Prefer:'return=minimal'}},true);await loadTax();render()}catch(x){toast('⚠ '+bad(x))}return}
 if(d.qafx!==undefined)return qaFix(d.qafx);
 if(d.aisv!==undefined)return aiSave(d.aisv);
 if(d.aitg!==undefined){const p=AIP.find(x=>String(x.id)===d.aitg);return aiAct(()=>api('/rest/v1/ai_providers?id=eq.'+p.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({enabled:!p.enabled})},true),p.enabled?tr('বন্ধ করা হয়েছে','Turned off'):tr('চালু করা হয়েছে','Turned on'))}
 if(d.aidl!==undefined){if(!confirm(tr('এই AI সরিয়ে দেবেন?','Remove this AI?')))return;return aiAct(()=>api('/rest/v1/ai_providers?id=eq.'+d.aidl,{method:'DELETE',headers:{Prefer:'return=minimal'}},true),tr('সরানো হয়েছে','Removed'))}
 if(d.aiadd!==undefined){const g=id=>$(id).value.trim(),o={name:g('npN'),slug:g('npS').toLowerCase(),mode:g('npM'),kind:g('npF'),base_url:g('npB'),model:g('npD'),secret_name:g('npK'),link:g('npL'),logo_url:g('npG'),descr:g('npT'),category:(AIC[0]||{slug:'general'}).slug,sort:AIP.length+1};
  if(!o.name||!/^[a-z0-9_-]+$/.test(o.slug)){toast('⚠ '+tr('নাম ও slug (ইংরেজি ছোট হাতের অক্ষর) দিন','Enter a name and a slug (a-z, 0-9, -, _)'));return}
  if(o.mode==='api'&&!/^AI_KEY_[A-Z0-9_]+$/.test(o.secret_name)){toast('⚠ '+tr('গোপন নাম AI_KEY_ দিয়ে শুরু হতে হবে','Secret name must look like AI_KEY_NAME'));return}
  if(o.base_url&&!/^https:\/\//.test(o.base_url)){toast('⚠ Base URL https:// দিয়ে শুরু হতে হবে');return}
  if(o.mode==='api'&&!o.model){toast('⚠ '+tr('মডেলের নাম দিন','Enter the model name'));return}
  return aiAct(()=>api('/rest/v1/ai_providers',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(o)},true),tr('যুক্ত হয়েছে','Added'))}
 if(d.aica!==undefined){const n=$('ncN').value.trim();if(!n)return;return aiAct(()=>api('/rest/v1/ai_categories',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({slug:'c'+Date.now().toString(36),name:n,sort:AIC.length+1})},true),tr('যুক্ত হয়েছে','Added'))}
 if(d.aicd!==undefined)return aiAct(()=>api('/rest/v1/ai_categories?id=eq.'+d.aicd,{method:'DELETE',headers:{Prefer:'return=minimal'}},true),tr('সরানো হয়েছে','Removed'));
 if(d.aist!==undefined){const l=Math.max(0,parseInt($('stL').value,10)||0);return aiAct(()=>api('/rest/v1/ai_settings?on_conflict=key',{method:'POST',headers:{Prefer:'return=minimal,resolution=merge-duplicates'},body:JSON.stringify([{key:'daily_limit_user_total',value:l},{key:'classify_provider',value:$('stC').value}])},true),tr('সংরক্ষিত','Saved'))}
 if(d.bkx!==undefined)return bkExport()});
document.addEventListener('change',async e=>{const x=e.target,d=x.dataset||{};
 if(x.id==='adS'){AS.subject=x.value;AS.items=[];return render()}
 if(x.id==='adF'){let t=AS.text||'';for(const f of x.files)t+=(t?'\n\n':'')+await f.text();AS.text=t;x.value='';return render()}
 if(x.id==='txS'){TXS=x.value;return render()}
 if(x.id==='qc'){qch=x.value;shown=50;return render()}
 if(x.id==='bkF'&&x.files[0]){const f=x.files[0];x.value='';return bkImport(f)}
 if(d.sk!==undefined){x.checked?SEL.add(+d.sk):SEL.delete(+d.sk);return render()}
 if(d.adk!==undefined){AS.items[+d.adk].pick=x.checked;return render()}
 const ix=d.fc??d.fl??d.fg;if(ix!==undefined){const it=AS.items[+ix];if(d.fc!==undefined)it.c=x.value.trim();if(d.fl!==undefined)it.sec=x.value.trim();if(d.fg!==undefined)it.g=x.value;it.cls=it.c?'manual':'pending';it.conf=it.c?1:0;it.isNew=false;return render()}});
document.addEventListener('input',e=>{if(e.target.id==='adT')AS.text=e.target.value});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.pid){d.open?AIO.add(d.dataset.pid):AIO.delete(d.dataset.pid)}},true);

if(S&&C())isAdmin().then(ok=>{if(!ok){LS.removeItem('adm_acc');S=null;gMsg='⚠ '+t('nad')}show()}).catch(e=>{if(S&&!/session/.test(String(e.message)))show();else show()});else show();
})();
</script>
