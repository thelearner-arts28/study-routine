 else if(d.apall!==undefined){burst(b);act(()=>api('/rest/v1/public_questions?status=eq.pending',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'approved'})}),t('all'))}
 else if(d.dl){if(confirm(t('dconf')))go(()=>api('/rest/v1/public_questions?id=eq.'+d.dl,{method:'DELETE',headers:{Prefer:'return=minimal'}}),t('del'))}
 else if(d.more!==undefined){shown+=50;render()}
 else if(d.pub!==undefined){burst(b);act(async()=>{await loadAll();const have=new Set(ALL.map(x=>key(x.data||{}))),un=MY.filter(m=>m&&m.q&&!have.has(key(m)));for(let i=0;i<un.length;i+=100)await api('/rest/v1/public_questions?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(un.slice(i,i+100).map(m=>{const{src,gen,...x}=m;return{key:key(m),owner:S.uid,status:'approved',data:x}}))})},t('pubAll'))}});
document.addEventListener('input',e=>{if(e.target.id==='qq'){q=e.target.value;shown=50;const p=e.target.selectionStart;render();const n=$('qq');if(n){n.focus();n.setSelectionRange(p,p)}}});
document.addEventListener('change',e=>{if(e.target.id==='qf'){sf=e.target.value;shown=50;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='ge'||e.target.id==='gp'))signin()});
document.addEventListener('visibilitychange',()=>{});
if(S&&C())isAdmin().then(ok=>{if(!ok){LS.removeItem('adm_acc');S=null;gMsg='⚠ '+t('nad')}show()}).catch(e=>{if(S&&!/session/.test(String(e.message)))show();else show()});else show();
})();
</script>
