<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f6bff">
<title>Admin · Thelearner.arts28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&text=0123456789&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@500;600;700;800&text=%E0%A7%A6%E0%A7%A7%E0%A7%A8%E0%A7%A9%E0%A7%AA%E0%A7%AB%E0%A7%AC%E0%A7%AD%E0%A7%AE%E0%A7%AF&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#f3f8ff;--tx:#10213a;--mut:#5b6b85;--bl:#2f6bff;--cy:#06b6d4;--bd:#dbe6fb;--ok:#059669;--er:#e11d48}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--tx);font:400 16px/1.6 'Poppins','Noto Sans Bengali','Hind Siliguri',sans-serif;font-variant-numeric:lining-nums tabular-nums;background:radial-gradient(circle at 12% 8%,rgba(47,107,255,.14),transparent 40%),radial-gradient(circle at 90% 90%,rgba(244,114,182,.16),transparent 42%),var(--bg)}
h1,h2,h3{font-family:'Poppins','Noto Sans Bengali','Anek Bangla','Hind Siliguri',sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2f6bff,#06b6d4);box-shadow:0 6px 16px rgba(47,107,255,.25)}
button:disabled{opacity:.55;cursor:default}
button.o{background:#fff;color:var(--bl);border:1.5px solid var(--bl);box-shadow:none}
button.dg{background:#fff;color:var(--er);border:1.5px solid #fecdd3;box-shadow:none}
button.ok{background:linear-gradient(135deg,#059669,#10b981)}
input,select{font:inherit;color:var(--tx);background:#f6f9ff;border:1.5px solid #dbe6fb;border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--bl);box-shadow:0 0 0 4px rgba(47,107,255,.14);background:#fff}
.mut{color:var(--mut)}
.hide{display:none!important}
.lt{display:flex;border:1.5px solid var(--bd);border-radius:999px;overflow:hidden;background:#f6f9ff}
.lt button{background:none;color:var(--mut);padding:4px 12px;border-radius:0;font-size:.8rem;box-shadow:none}
.lt button.on{background:var(--bl);color:#fff}
/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:410px;background:#fff;border-radius:28px;padding:26px 22px 22px;box-shadow:0 24px 60px rgba(47,107,255,.18);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#2f6bff,#06b6d4,#f472b6)}
.card .top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}
.sh{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(135deg,#2f6bff,#06b6d4);box-shadow:0 8px 18px rgba(47,107,255,.3)}
.card h2{font-size:1.55rem;margin-bottom:4px}
.fd{margin:12px 0}
.msg{min-height:1.5em;margin:10px 0 0;font-size:.9rem;text-align:center;color:var(--mut)}
/* app */
header.bar{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#2f6bff,#06b6d4);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.bar h1{font-size:1.1rem;flex:1;display:flex;align-items:center;gap:8px;min-width:150px}
header.bar .em{font-size:.8rem;opacity:.92;word-break:break-all}
header.bar button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.6);box-shadow:none;padding:6px 12px;font-size:.85rem}
header.bar .lt{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6)}
header.bar .lt button{border:0;background:none;color:#fff;padding:4px 11px}
header.bar .lt button.on{background:#fff;color:var(--bl)}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;max-width:980px;margin:0 auto}
nav.tabs button{background:#fff;color:var(--tx);border:1.5px solid var(--bd);box-shadow:none;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav.tabs button.on{background:linear-gradient(135deg,#2f6bff,#06b6d4);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(47,107,255,.25)}
.badge{background:var(--er);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 8px;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:12px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st{background:#fff;border-radius:20px;padding:14px;border-top:4px solid var(--c);box-shadow:0 8px 22px rgba(47,107,255,.1)}
.st .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:1.2rem;background:var(--c2)}
.st b{display:block;font:800 1.9rem/1.1 'Poppins','Noto Sans Bengali','Anek Bangla',sans-serif;margin-top:8px}
.st span{color:var(--mut);font-size:.85rem}
.pn{background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 22px rgba(47,107,255,.08);margin-top:14px}
.pn h3{font-size:1.1rem;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #edf2fb}
.row:first-of-type{border-top:0}
.row .tx{flex:1;min-width:0}
.row .q{font-weight:600;word-break:break-word}
.row .meta{font-size:.82rem;color:var(--mut);margin-top:2px;word-break:break-word}
.row .acts{display:flex;gap:6px;flex:none}
.chip{display:inline-block;background:#eef3ff;color:var(--bl);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;margin-right:4px}
.bar2{height:10px;border-radius:6px;background:#eaf0fb;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#2f6bff,#06b6d4);border-radius:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tools>*{flex:1;min-width:140px}
.tools button{flex:none}
@media(max-width:560px){header.bar h1{flex:1 1 auto;min-width:0}header.bar .em{order:9;flex-basis:100%;font-size:.75rem}.row{flex-wrap:wrap}.row .acts{width:100%}.row .acts button{flex:1}.row .acts .dg[data-rj]{flex:none}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#10213a;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" class="hide">
  <header class="bar"><h1>🛡️ <span id="ttl">Admin panel</span></h1><span class="em" id="who"></span><span id="lp"></span><button id="out">Log out</button></header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast hide"></div>
<script>
(()=>{
const C=()=>{const c=window.CLOUD;return c&&c.url&&c.key?c:null},LS=localStorage,$=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null;try{S=JSON.parse(LS.getItem('adm_acc'))}catch{}
let lang=LS.getItem('adm_lang')==='bn'?'bn':'en',tab='ov',ALL=[],MY=null,shown=50,busy=false,rf=null,gMsg='',q='',sf='';
const TX={
en:{ttl:'Admin panel',si:'Admin sign in',sub:'Only owner accounts can open this panel. It has its own login, separate from the learner site.',em:'Email address',pw:'Password',go:'Sign in',nc:'Cloud is not set up (config.js is missing).',cred:'Incorrect email or password.',nad:'This account is not an admin. Add it to the app_admins table first.',net:'Check your internet connection.',wait:'Please wait…',out:'Log out',
 ov:'Overview',pend:'Pending',qs:'Questions',lib:'My library',approved:'Approved questions',pending:'Waiting for review',contrib:'Contributors',subj:'Subjects',bys:'By subject',approve:'Approve',reject:'Reject',all:'Approve all',none:'Nothing is waiting for review.',by:'Submitted by',search:'Search questions…',allS:'All subjects',del:'Delete',dconf:'Delete this question for everyone?',more:'Show more',empty:'No questions yet.',
 lT:'In your account',lP:'Already public',lN:'Not public yet',lH:'Questions saved in your account. Publish the ones that are not public yet so every learner can see them.',lNo:'No saved questions found. Log in on the learner site once so they sync to your account.',pubAll:'Publish all',ok:'Done',ans:'Answer',refresh:'Refresh',owner:'Owner',time:'Time',total:'questions'},
bn:{ttl:'অ্যাডমিন প্যানেল',si:'অ্যাডমিন লগইন',sub:'শুধু মালিকের অ্যাকাউন্ট এই প্যানেল খুলতে পারে। এর লগইন শিক্ষার্থীদের সাইট থেকে আলাদা।',em:'ইমেইল',pw:'পাসওয়ার্ড',go:'লগইন',nc:'ক্লাউড সেটআপ হয়নি (config.js নেই)।',cred:'ইমেইল বা পাসওয়ার্ড ভুল।',nad:'এই অ্যাকাউন্ট অ্যাডমিন নয়। আগে app_admins টেবিলে যোগ করুন।',net:'ইন্টারনেট সংযোগ দেখুন।',wait:'অপেক্ষা করুন…',out:'লগআউট',
 ov:'সারসংক্ষেপ',pend:'অপেক্ষায়',qs:'প্রশ্নসমূহ',lib:'আমার সংগ্রহ',approved:'অনুমোদিত প্রশ্ন',pending:'যাচাইয়ের অপেক্ষায়',contrib:'অবদানকারী',subj:'বিষয়',bys:'বিষয় অনুযায়ী',approve:'অনুমোদন',reject:'বাতিল',all:'সব অনুমোদন করুন',none:'যাচাইয়ের জন্য কিছু অপেক্ষায় নেই।',by:'জমা দিয়েছেন',search:'প্রশ্ন খুঁজুন…',allS:'সব বিষয়',del:'মুছুন',dconf:'প্রশ্নটি সবার কাছ থেকে মুছে ফেলবেন?',more:'আরও দেখুন',empty:'এখনো কোনো প্রশ্ন নেই।',
 lT:'আপনার অ্যাকাউন্টে',lP:'আগে থেকেই প্রকাশিত',lN:'এখনো প্রকাশ হয়নি',lH:'আপনার অ্যাকাউন্টে জমা থাকা প্রশ্ন। যেগুলো এখনো প্রকাশ হয়নি সেগুলো প্রকাশ করুন, যাতে সব শিক্ষার্থী দেখতে পায়।',lNo:'জমা থাকা কোনো প্রশ্ন পাওয়া যায়নি। শিক্ষার্থীদের সাইটে একবার লগইন করুন, তাহলে সিঙ্ক হয়ে আসবে।',pubAll:'সব প্রকাশ করুন',ok:'হয়েছে',ans:'উত্তর',refresh:'রিফ্রেশ',owner:'মালিক',time:'সময়',total:'টি প্রশ্ন'}};
const t=k=>TX[lang][k]??TX.en[k]??k,fm=n=>Number(n).toLocaleString(lang==='bn'?'bn-BD':'en-US'),L='কখগঘ';
const toast=x=>{const e=$('toast');e.textContent=x;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2400)};
async function api(path,o={},auth=true){const c=C();if(!c)throw Error('cfg');const h={apikey:c.key,'Content-Type':'application/json',...(o.headers||{})};
 if(auth){await fresh();h.Authorization='Bearer '+S.at}else h.Authorization='Bearer '+c.key;
 const r=await fetch(c.url.replace(/\/+$/,'')+path,{...o,headers:h});let j=null;try{j=await r.json()}catch{}
 if(!r.ok)throw Object.assign(Error(j&&(j.msg||j.error_description||j.message||j.error)||String(r.status)),{status:r.status});return j}
const setS=j=>{S={email:j.user.email,uid:j.user.id,at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};LS.setItem('adm_acc',JSON.stringify(S))};
let RF=null;
function fresh(){if(!S)return Promise.reject(Error('session'));if(S.exp-Date.now()>60000)return Promise.resolve();
 return RF||(RF=api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:S.rt})},false).then(setS).catch(e=>{if([400,401,403].includes(e.status))logout();throw e}).finally(()=>{RF=null}))}
async function isAdmin(){const r=await api('/rest/v1/app_admins?select=user_id&user_id=eq.'+S.uid);return Array.isArray(r)&&r.length>0}
function logout(){S=null;LS.removeItem('adm_acc');clearInterval(rf);ALL=[];MY=null;show()}
const bad=e=>{const m=String(e&&e.message||e);return/Invalid login/i.test(m)?t('cred'):/Failed to fetch|NetworkError|Load failed/i.test(m)?t('net'):m};
/* ---------- gate ---------- */
const pill=()=>`<div class="lt"><button data-l="en" class="${lang==='en'?'on':''}">EN</button><button data-l="bn" class="${lang==='bn'?'on':''}">বাং</button></div>`;
function gate(){const e0=($('ge')||{}).value||'';$('gate').innerHTML=`<div class="card"><div class="top"><div class="sh">🛡️</div>${pill()}</div><h2>${t('si')}</h2><p class="mut" style="margin:0 0 12px">${t('sub')}</p>
 <div class="fd"><input id="ge" type="email" placeholder="${t('em')}" aria-label="${t('em')}" autocomplete="email" value="${esc(e0)}"></div>
 <div class="fd"><input id="gp" type="password" placeholder="${t('pw')}" aria-label="${t('pw')}" autocomplete="current-password"></div>
 <button id="gb" style="width:100%;padding:13px;border-radius:14px">${t('go')}</button><p class="msg" id="gm" ${gMsg?'':''}>${esc(gMsg)}</p></div>`}
async function signin(){const em=$('ge').value.trim(),pw=$('gp').value;if(!em||!pw)return;if(!C()){gMsg='⚠ '+t('nc');gate();return}
 const m=$('gm');m.style.color='';m.textContent=t('wait');$('gb').disabled=true;
 try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em,password:pw})},false);setS(j);
  if(!(await isAdmin())){LS.removeItem('adm_acc');S=null;gMsg='⚠ '+t('nad');gate();return}
  gMsg='';show()}catch(e){gMsg='⚠ '+bad(e);gate()}}
/* ---------- data ---------- */
async function loadAll(){const out=[];for(let off=0;;off+=1000){const r=await api('/rest/v1/public_questions?select=id,key,owner,owner_email,status,created_at,data&order=id.desc&limit=1000&offset='+off);out.push(...r);if(r.length<1000)break}ALL=out}
async function loadMy(){const r=await api('/rest/v1/user_data?select=data&user_id=eq.'+S.uid);const v=r&&r[0]&&r[0].data&&r[0].data.keys&&r[0].data.keys.mq;MY=v&&Array.isArray(v.v)?v.v:[]}
const key=d=>d.s+'|'+d.c+'|'+d.q,pendList=()=>ALL.filter(x=>x.status==='pending').sort((a,b)=>a.id-b.id),apprList=()=>ALL.filter(x=>x.status==='approved');
async function act(fn,msg){if(busy)return;busy=true;try{await fn();await loadAll();if(tab==='lib')await loadMy();toast('✓ '+(msg||t('ok')))}catch(e){toast('⚠ '+bad(e))}finally{busy=false;render()}}
/* ---------- render ---------- */
const stat=(ic,n,lab,c,c2)=>`<div class="st" style="--c:${c};--c2:${c2}"><div class="ic">${ic}</div><b>${fm(n)}</b><span>${lab}</span></div>`;
function qRow(r,mode){const d=r.data||{},o=d.o&&d.o.length?`<div class="meta">${d.o.map((x,i)=>`${L[i]}) ${esc(x)}`).join(' &nbsp; ')}<br>✓ ${esc(L[d.a])}) ${esc(d.o[d.a])}</div>`:`<div class="meta">${t('ans')}: ${esc(d.t||'')}</div>`;
 return`<div class="row"><div class="tx"><div class="q">${esc(d.q)}</div><div class="meta"><span class="chip">${esc(d.s)}</span><span class="chip">${esc(d.c)}</span>${d.sec?`<span class="chip">${esc(d.sec)}</span>`:''}</div>${o}<div class="meta">👤 ${esc(r.owner_email||'—')} · ${esc(new Date(r.created_at).toLocaleString(lang==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</div></div>
 <div class="acts">${mode==='p'?`<button class="ok" data-ap="${r.id}">✓ ${t('approve')}</button><button class="dg" data-rj="${r.id}">✗</button>`:`<button class="dg" data-dl="${r.id}">${t('del')}</button>`}</div></div>`}
function render(){const P=pendList(),A=apprList();
 $('ttl').textContent=t('ttl');$('who').textContent=S?S.email:'';$('lp').innerHTML=pill();$('out').textContent=t('out');
 $('tabs').innerHTML=[['ov','📊',t('ov')],['pend','⏳',t('pend'),P.length],['qs','📚',t('qs')],['lib','🗂️',t('lib')]].map(x=>`<button data-t="${x[0]}" class="${tab===x[0]?'on':''}">${x[1]} ${x[2]}${x[3]?`<span class="badge">${fm(x[3])}</span>`:''}</button>`).join('');
 let h='';
 if(tab==='ov'){const sb={};A.forEach(x=>{const s=(x.data||{}).s||'—';sb[s]=(sb[s]||0)+1});const mx=Math.max(1,...Object.values(sb)),owners=new Set(ALL.map(x=>x.owner)).size;
  h=`<div class="grid">${stat('✅',A.length,t('approved'),'#059669','#d9f7ea')}${stat('⏳',P.length,t('pending'),'#f59e0b','#fff1d1')}${stat('👥',owners,t('contrib'),'#2f6bff','#e4edff')}${stat('🧩',Object.keys(sb).length,t('subj'),'#f472b6','#ffe5f1')}</div>
  <div class="pn"><h3>${t('bys')}</h3>${Object.keys(sb).length?Object.entries(sb).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><b>${esc(k)}</b><span>${fm(v)}</span></div><div class="bar2"><i style="width:${v/mx*100}%"></i></div></div>`).join(''):`<p class="mut">${t('empty')}</p>`}</div>`}
 else if(tab==='pend'){h=`<div class="pn"><div class="tools"><button class="ok" data-apall ${P.length?'':'disabled'}>✓ ${t('all')}</button><button class="o" data-rf>↻ ${t('refresh')}</button></div>${P.length?P.map(r=>qRow(r,'p')).join(''):`<p class="mut">${t('none')}</p>`}</div>`}
 else if(tab==='qs'){const ss=[...new Set(A.map(x=>(x.data||{}).s))].filter(Boolean),f=A.filter(x=>{const d=x.data||{};return(!sf||d.s===sf)&&(!q||(d.q+' '+d.c+' '+(d.sec||'')+' '+(d.t||'')).toLowerCase().includes(q.toLowerCase()))});
  h=`<div class="pn"><div class="tools"><input id="qq" placeholder="${t('search')}" value="${esc(q)}"><select id="qf"><option value="">${t('allS')}</option>${ss.map(s=>`<option ${s===sf?'selected':''}>${esc(s)}</option>`).join('')}</select></div><p class="mut" style="margin:0 0 4px">${fm(f.length)} ${t('total')}</p>${f.slice(0,shown).map(r=>qRow(r,'a')).join('')||`<p class="mut">${t('empty')}</p>`}${f.length>shown?`<div style="text-align:center;margin-top:10px"><button class="o" data-more>${t('more')}</button></div>`:''}</div>`}
 else{if(MY===null)h=`<div class="pn"><p class="mut">${t('wait')}</p></div>`;else{const have=new Set(ALL.map(x=>key(x.data||{}))),un=MY.filter(m=>m&&m.q&&!have.has(key(m)));
  h=`<div class="grid">${stat('🗂️',MY.length,t('lT'),'#2f6bff','#e4edff')}${stat('🌐',MY.length-un.length,t('lP'),'#059669','#d9f7ea')}${stat('📤',un.length,t('lN'),'#f59e0b','#fff1d1')}</div>
  <div class="pn"><p class="mut" style="margin-top:0">${MY.length?t('lH'):t('lNo')}</p><div class="tools"><button class="ok" data-pub ${un.length?'':'disabled'}>🌐 ${t('pubAll')} (${fm(un.length)})</button></div>${un.slice(0,30).map(m=>`<div class="row"><div class="tx"><div class="q">${esc(m.q)}</div><div class="meta"><span class="chip">${esc(m.s)}</span><span class="chip">${esc(m.c)}</span></div></div></div>`).join('')}${un.length>30?`<p class="mut">… +${fm(un.length-30)}</p>`:''}</div>`}}
 $('main').innerHTML=h}
function show(){const on=!!S;$('gate').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);if(!on){gate();return}
 document.documentElement.lang=lang;render();loadAll().then(()=>{render();if(tab==='lib')return loadMy().then(render)}).catch(e=>{if(!S)return;toast('⚠ '+bad(e))});
 clearInterval(rf);rf=setInterval(async()=>{if(!S||busy||document.hidden)return;try{const before=pendList().length;await loadAll();if(pendList().length!==before)render()}catch{}},5000)}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.l){lang=d.l;LS.setItem('adm_lang',lang);document.documentElement.lang=lang;S?render():gate();return}
 if(b.id==='gb'){signin();return}
 if(b.id==='out'){logout();return}
 if(d.t){tab=d.t;shown=50;render();if(tab==='lib'&&MY===null)loadMy().then(render).catch(()=>{});return}
 if(d.rf!==undefined){act(()=>Promise.resolve(),t('ok'));return}
 if(d.ap)act(()=>api('/rest/v1/public_questions?id=eq.'+d.ap,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'approved'})}),t('approve'));
 else if(d.rj)act(()=>api('/rest/v1/public_questions?id=eq.'+d.rj,{method:'DELETE',headers:{Prefer:'return=minimal'}}),t('reject'));
 else if(d.apall!==undefined)act(()=>api('/rest/v1/public_questions?status=eq.pending',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'approved'})}),t('all'));
 else if(d.dl){if(confirm(t('dconf')))act(()=>api('/rest/v1/public_questions?id=eq.'+d.dl,{method:'DELETE',headers:{Prefer:'return=minimal'}}),t('del'))}
 else if(d.more!==undefined){shown+=50;render()}
 else if(d.pub!==undefined)act(async()=>{await loadAll();const have=new Set(ALL.map(x=>key(x.data||{}))),un=MY.filter(m=>m&&m.q&&!have.has(key(m)));for(let i=0;i<un.length;i+=100)await api('/rest/v1/public_questions?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(un.slice(i,i+100).map(m=>{const{src,gen,...x}=m;return{key:key(m),owner:S.uid,status:'approved',data:x}}))})},t('pubAll'))});

document.addEventListener('change',e=>{if(e.target.id==='qf'){sf=e.target.value;shown=50;render()}});

})();
